<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>男子ラクロスのクリース（ゴールを囲む半径3mの円）。攻める側の選手は円に入れず、ゴーリーは円の中ならボールを手で止めてよく、守る側が円の中でボールを持てるのは5秒までであることを示す</title>
<rect width="640" height="400" fill="#ffffff"/>
<rect x="20" y="20" width="620" height="360" fill="#e8f3e8" opacity="0"/>
<circle cx="190" cy="210" r="99.0" fill="#ffffff" stroke="#1f2a44" stroke-width="4"/>
<polygon points="190,179.805 190,240.195 119.71000000000001,210" fill="#f3f4f7" stroke="#9aa3b2" stroke-width="2"/>
<line x1="190" y1="179.805" x2="190" y2="240.195" stroke="#d64545" stroke-width="8"/>
<text x="160" y="206" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="700" >ゴール</text>
<circle cx="235" cy="210" r="14" fill="#f2a900" stroke="#ffffff" stroke-width="1.5"/><text x="235" y="214.68" font-size="13" text-anchor="middle" fill="#1f2a44" font-weight="700" >G</text>
<circle cx="344.0" cy="140" r="14" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/><text x="344.0" y="144.32" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="700" >AT</text>
<line x1="329.0" y1="148" x2="295.0" y2="170" stroke="#d64545" stroke-width="3" stroke-dasharray="6 4"/>
<text x="285.0" y="182" font-size="24" text-anchor="middle" fill="#d64545" font-weight="700" >×</text>
<line x1="190" y1="210" x2="190" y2="309.0" stroke="#1f2a44" stroke-width="2" stroke-dasharray="5 4"/>
<text x="198" y="279.0" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="700" >半径3m</text>
<text x="180" y="337.0" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="400" >ゴールの幅・高さは1.83m</text>
<text x="330" y="60" font-size="17" text-anchor="start" fill="#1f2a44" font-weight="700" >クリース（ゴールを囲む円）のルール</text>
<text x="330" y="108" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >攻める側の選手（AT）は</text>
<text x="330" y="132" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >円の中に入れません。</text>
<text x="330" y="182" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >ゴーリーは円の中なら、</text>
<text x="330" y="206" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >手でもボールを止めてよい。</text>
<text x="330" y="256" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >円の中で守る側がボールを</text>
<text x="330" y="280" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >持てるのは5秒までです。</text>
</svg>
