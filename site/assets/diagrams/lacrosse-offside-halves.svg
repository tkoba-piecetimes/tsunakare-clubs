<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>男子ラクロスのオフサイド（人数制限）の図。センターラインで分けた半分ずつに入れる人数は、攻める側のハーフで6人まで、守る側のハーフで7人までで、青が自陣から運び出す例を示す</title>
<rect width="640" height="450" fill="#ffffff"/>
<rect x="40" y="100" width="560" height="230" fill="#e8f3e8" stroke="#1f2a44" stroke-width="3"/>
<line x1="320" y1="100" x2="320" y2="330" stroke="#1f2a44" stroke-width="5"/>
<circle cx="92" cy="215" r="16" fill="#fff" fill-opacity=".6" stroke="#1f2a44" stroke-width="2"/>
<circle cx="548" cy="215" r="16" fill="#fff" fill-opacity=".6" stroke="#1f2a44" stroke-width="2"/>
<text x="180" y="52" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >左のハーフ（青のゴール側）</text>
<text x="460" y="52" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >右のハーフ（赤のゴール側）</text>
<rect x="55.0" y="66.0" width="250" height="28" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1"/><text x="180" y="85.76" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >青 7人（ゴーリー含む）／赤 6人</text>
<rect x="335.0" y="66.0" width="250" height="28" rx="6" fill="#ffffff" stroke="#1f2a44" stroke-width="1"/><text x="460" y="85.76" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >青 3人／赤 4人（ゴーリー含む）</text>
<circle cx="92" cy="215" r="13" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="92" y="219.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700" >G</text>
<circle cx="140" cy="140" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="140" cy="215" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="140" cy="290" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="215" cy="165" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="215" cy="265" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="260" cy="215" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="190" cy="120" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="255" cy="150" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="270" cy="245" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="190" cy="310" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="225" cy="215" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="120" cy="180" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="400" cy="150" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="440" cy="215" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="400" cy="280" r="12" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="548" cy="215" r="13" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/><text x="548" y="219.68" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="700" >G</text>
<circle cx="490" cy="150" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="490" cy="280" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="495" cy="215" r="12" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<text x="320" y="352" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >センターライン</text>
<line x1="320" y1="330" x2="320" y2="338" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="70" cy="380" r="9" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/>
<text x="86" y="386" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >青チーム</text>
<circle cx="190" cy="380" r="9" fill="#d64545" stroke="#ffffff" stroke-width="1.5"/>
<text x="206" y="386" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="400" >赤チーム</text>
<text x="300" y="386" font-size="15" text-anchor="start" fill="#4a5568" font-weight="400" >例：青がゴール前から運び出す場面</text>
<text x="320" y="418" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >ハーフ内に入れるのは、攻める側のハーフで6人まで、守る側のハーフで7人まで</text>
<text x="320" y="438" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >（ゴーリー含む）。超えると「オフサイド」の反則になります。</text>
</svg>
