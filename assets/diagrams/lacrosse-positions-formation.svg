<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" role="img">
<title>男子ラクロスのポジション配置の例。ゴーリー1人、ディフェンス3人、ミッドフィールダー3人、アタック3人が自陣のゴールから相手ゴールへ向けて並ぶ</title>
<rect width="640" height="410" fill="#ffffff"/>
<rect x="30" y="70" width="580" height="250" fill="#e8f3e8" stroke="#1f2a44" stroke-width="3"/>
<line x1="320" y1="70" x2="320" y2="320" stroke="#1f2a44" stroke-width="3"/>
<circle cx="62" cy="195" r="26" fill="#fff" fill-opacity=".6" stroke="#1f2a44" stroke-width="2"/>
<line x1="62" y1="183" x2="62" y2="207" stroke="#d64545" stroke-width="6"/>
<circle cx="578" cy="195" r="26" fill="#fff" fill-opacity=".6" stroke="#1f2a44" stroke-width="2"/>
<line x1="578" y1="183" x2="578" y2="207" stroke="#d64545" stroke-width="6"/>
<text x="578" y="252" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="700" >相手のゴール</text>
<text x="62" y="252" font-size="14" text-anchor="middle" fill="#1f2a44" font-weight="700" >自分のゴール</text>
<text x="95" y="62" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >ゴーリー</text>
<circle cx="95" cy="195" r="17" fill="#f2a900" stroke="#ffffff" stroke-width="1.5"/><text x="95" y="200.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >G</text>
<text x="195" y="62" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >ディフェンス</text>
<circle cx="195" cy="120" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="195" y="125.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >DF</text>
<circle cx="195" cy="195" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="195" y="200.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >DF</text>
<circle cx="195" cy="270" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="195" y="275.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >DF</text>
<text x="330" y="62" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >ミッドフィールダー</text>
<circle cx="330" cy="120" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="330" y="125.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >MF</text>
<circle cx="330" cy="195" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="330" y="200.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >MF</text>
<circle cx="330" cy="270" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="330" y="275.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >MF</text>
<text x="490" y="62" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >アタック</text>
<circle cx="490" cy="120" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="490" y="125.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >AT</text>
<circle cx="490" cy="195" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="490" y="200.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >AT</text>
<circle cx="490" cy="270" r="17" fill="#2f6fd6" stroke="#ffffff" stroke-width="1.5"/><text x="490" y="275.04" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="700" >AT</text>
<line x1="200" y1="342" x2="440" y2="342" stroke="#1f2a44" stroke-width="3"/>
<polygon points="440,333 456,342 440,351" fill="#1f2a44"/>
<text x="150" y="348" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="700" >攻める向き</text>
<text x="320" y="374" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="400" >男子は1チーム10人＝ゴーリー1・ディフェンス3・ミッドフィールダー3・アタック3</text>
<text x="320" y="396" font-size="14" text-anchor="middle" fill="#4a5568" font-weight="400" >位置は配置の一例です。試合中は動き回ります。</text>
</svg>
