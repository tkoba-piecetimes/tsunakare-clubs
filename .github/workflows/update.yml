name: Update and deploy site

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 6:00 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write  # OIDC (Workload Identity連携) に必須

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pykakasi google-auth requests
      - name: Fetch JLA data
        run: python pipeline/fetch_jla.py
      - id: auth
        name: Authenticate to Google Cloud (Workload Identity, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/204314315704/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions
          service_account: lacrossemania-metrics-reader@planar-acronym-505101-h5.iam.gserviceaccount.com
      - name: Fetch metrics (GA4 / Search Console)
        run: python pipeline/fetch_metrics.py
      - name: Generate site
        run: python pipeline/generate_site.py
      - name: Commit updated data & site
        if: github.event_name != 'push'
        run: |
          git config user.name "tsunakare-bot"
          git config user.email "bot@piecetimes.jp"
          git add data site
          git diff --cached --quiet || git commit -m "chore: auto-update league data"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
